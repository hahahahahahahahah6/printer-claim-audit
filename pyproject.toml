[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-claim-audit"
version = "0.1.0"
description = "Static audit of local hardcopy job submission claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
printer-claim-audit = "printer_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["printer_claim_audit*"]
